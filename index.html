<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Market Kiều Long</title>

<style>
*{box-sizing:border-box}
body{
 font-family:'Segoe UI',Arial,sans-serif;
 background:linear-gradient(135deg,#f2f6ff,#eaf0ff);
 margin:0;padding-bottom:40px
}
h1{text-align:center;padding:16px;background:#1e88e5;color:#fff;margin:0}
.products{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
 gap:15px;padding:15px
}
.product{
 background:#fff;padding:12px;border-radius:14px;
 box-shadow:0 8px 20px rgba(0,0,0,.08);
 text-align:center
}
.product img{width:100%;height:140px;object-fit:cover;border-radius:10px}
.price{color:#d32f2f;font-weight:bold;margin:6px 0}
select,textarea,input{
 width:100%;padding:10px;border-radius:10px;
 border:1px solid #ccc;font-size:15px;margin-bottom:10px
}
button{
 width:100%;padding:12px;border:none;border-radius:12px;
 font-size:16px;font-weight:bold;cursor:pointer
}
.btn-add{background:#4caf50;color:#fff}
.btn-send{background:#ff9800;color:#fff}
#orderBox,#paymentBox,#infoBox{
 background:#fff;margin:15px;padding:15px;
 border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,.1)
}
#orderList li{
 background:#f6f8ff;margin-bottom:6px;
 padding:8px;border-radius:8px;
 display:flex;justify-content:space-between;align-items:center
}
#totalMoney{text-align:center;color:#d32f2f;font-size:18px}
.remove{
 background:#ff5252;color:#fff;border:none;
 width:28px;height:28px;border-radius:50%;cursor:pointer
}
</style>
</head>

<body>

<h1>Market Kiều Long</h1>

<!-- ✅ THÔNG TIN KHÁCH HÀNG (HIỆN TRƯỚC) -->
<div id="infoBox">
<h3 style="text-align:center;color:#1e88e5">👤 THÔNG TIN KHÁCH HÀNG</h3>
<input id="customerName" placeholder="Họ và tên *">
<input id="customerPhone" placeholder="Số điện thoại *">
<textarea id="customerAddress" placeholder="Địa chỉ giao hàng *"></textarea>

<button class="btn-send" onclick="startShopping()">➡️ TIẾP TỤC MUA HÀNG</button>
</div>

<!-- ❌ ẨN MUA HÀNG LÚC ĐẦU -->
<div id="shopArea" style="display:none">

<div class="products" id="products"></div>

<div id="orderBox">
<h3 style="text-align:center;color:#1e88e5">🧾 ĐƠN HÀNG</h3>
<ul id="orderList"></ul>
<p id="totalMoney"><b>💰 Tổng tiền: 0 đ</b></p>

<textarea id="note" placeholder="Ghi chú thêm (nếu có)"></textarea>
<button class="btn-send" onclick="sendOrder()">📤 GỬI ĐƠN HÀNG</button>
</div>

<div id="paymentBox" style="display:none;text-align:center">
<h3>💳 CHỌN PHƯƠNG THỨC THANH TOÁN</h3>
<button style="background:#4caf50;color:#fff;margin-bottom:10px"
onclick="alert('🚚 Thanh toán khi nhận hàng')">
🚚 Thanh toán khi nhận hàng
</button>
<button style="background:#e53935;color:#fff" onclick="showQR()">📱 Thanh toán bằng QR</button>
<div id="qrBox" style="display:none;margin-top:15px">
<img src="qr.jpg" style="width:260px;border-radius:12px">
<p><b>Market Kiều Long</b></p>
</div>
</div>

</div>

<script>
const BOT_TOKEN="8365554346:AAGJdRnQ9sbp2EQIGtP289uwuBwEp3bg-kE";
const CHAT_ID="6572363141";

const products=[
 { name:"Lòng Mỡ",       price:70000,  image:"https://cly.1cdn.vn/2022/01/29/s1.media.ngoisao.vn-resize_660-news-2022-01-28-_long-luoc-4-ngoisaovn-w2048-h1536.jpg" },
 { name:"Lòng Tiết",     price:70000,  image:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTEdc9U2P7U89S6tDGnvM6LvOdOC9Y_mhuT5A&s" },
 { name:"Gan Lợn",       price:50000,  image:"https://media.cooky.vn/article/s640/Article1302-635894058266480200.jpg" },
 { name:"Phổi Lợn",      price:30000,  image:"https://bhd.1cdn.vn/2021/09/10/files-library-images-site-1-20210910-web-bo-phan-o-lon-tuyet-doi-phai-bo-keo-ca-nha-ung-thu-30-161959.jpg" },
 { name:"Chí Đá",        price:450000, image:"https://cdn2.fptshop.com.vn/unsafe/800x0/bi_quyet_luoc_trang_lon_03_82bd2e013b.jpg" },
 { name:"Tiết Luộc",     price:15000,  image:"https://phongkhambinhan.com/wp-content/uploads/2024/10/tiet-lon.jpg" },
 { name:"Cuống Họng",    price:200000, image:"https://cdn2.fptshop.com.vn/unsafe/1920x0/filters:format(webp):quality(75)/cuong_hong_heo_0_c8e4ca6df7.jpg" },
 { name:"Bong Bóng Lợn", price:20000,  image:"https://cdn.tgdd.vn/2021/01/content/bb9-800x500.jpg" },
 { name:"Lòng Non",      price:70000,  image:"https://cdn.tgdd.vn/Files/2024/06/02/1566412/meo-so-che-long-non-cuc-hieu-qua-ma-khong-dung-giam-va-muoi-202406030115021361.jpg" },
 { name:"Đầu Lòng Non",  price:200000, image:"https://cdn.tgdd.vn/Files/2022/02/11/1414960/long-se-dieu-la-gi-gia-long-se-dieu-cach-luoc-long-se-dieu-dung-chuan-202202111353265979.jpg" },
 { name:"Nõn Đuôi",      price:150000, image:"https://img-global.cpcdn.com/recipes/591f2d32d911a1b5/680x781cq80/kh%E1%BA%A5u-duoi-heo-pha-l%E1%BA%A5u-recipe-main-photo.jpg" },
 { name:"Dạ Dày",        price:370000, image:"https://cdn.tgdd.vn/Files/2019/12/27/1228778/2-cach-luoc-bao-tu-heo-gion-ngon-ban-nen-biet--760x367.jpg" },
 { name:"Cổ Hũ",         price:400000, image:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRMJJOAGhMac3lZd-JmlEVfx8j_8xFsPueJJw&s" }


];

const order={};
const productsDiv=document.getElementById("products");

/* ✅ CHẶN – CHƯA NHẬP THÔNG TIN KHÔNG MUA */
function startShopping(){
 if(!customerName.value||!customerPhone.value||!customerAddress.value){
  alert("❗ Vui lòng nhập đầy đủ thông tin");
  return;
 }
 document.getElementById("infoBox").style.display="none";
 document.getElementById("shopArea").style.display="block";
}

/* SẢN PHẨM */
products.forEach((p,i)=>{
 let opt="";
 for(let k=1;k<=10;k+=0.5) opt+=`<option>${k} kg</option>`;
 productsDiv.innerHTML+=`
 <div class="product">
 <img src="${p.image}">
 <h4>${p.name}</h4>
 <div class="price">${p.price.toLocaleString()} đ/kg</div>
 <select id="q${i}">${opt}</select>
 <button class="btn-add" onclick="add(${i})">Chọn</button>
 </div>`;
});

function add(i){
 let q=parseFloat(document.getElementById("q"+i).value);
 let n=products[i].name,p=products[i].price;
 order[n]?order[n].qty+=q:order[n]={qty:q,price:p};
 render();
}

function render(){
 let ul=document.getElementById("orderList"),total=0;
 ul.innerHTML="";
 for(let i in order){
  let m=order[i].qty*order[i].price; total+=m;
  ul.innerHTML+=`
  <li>
   <span>${i}<br>${order[i].qty} kg<br><b>${m.toLocaleString()} đ</b></span>
   <button class="remove" onclick="delete order['${i}'],render()">✕</button>
  </li>`;
 }
 totalMoney.innerHTML=`<b>💰 Tổng tiền: ${total.toLocaleString()} đ</b>`;
}

function sendOrder(){
 let msg=`🧾 ĐƠN HÀNG\n👤 ${customerName.value}\n📞 ${customerPhone.value}\n🏠 ${customerAddress.value}\n\n`;
 let total=0;
 for(let i in order){
  let m=order[i].qty*order[i].price;
  total+=m; msg+=`- ${i}: ${m.toLocaleString()}đ\n`;
 }
 msg+=`\n💰 Tổng: ${total.toLocaleString()}đ\n📝 ${note.value||"Không có"}`;

 fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({chat_id:CHAT_ID,text:msg})
 }).then(()=>{alert("✅ Đã gửi đơn");paymentBox.style.display="block";});
}

function showQR(){qrBox.style.display="block";}
</script>

</body>
</html>
