<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Market Kiều Long</title>

<style>
*{box-sizing:border-box}
body{
 font-family:'Segoe UI',Arial,sans-serif;
 background:linear-gradient(135deg,#f2f6ff,#eaf0ff);
 margin:0;padding-bottom:40px
}
h1{
 text-align:center;
 padding:16px;
 background:#1e88e5;
 color:#fff;
 margin:0
}
.products{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
 gap:15px;padding:15px
}
.product{
 background:#fff;
 padding:12px;
 border-radius:14px;
 box-shadow:0 8px 20px rgba(0,0,0,.08);
 text-align:center
}
.product img{
 width:100%;height:140px;
 object-fit:cover;
 border-radius:10px
}
.price{color:#d32f2f;font-weight:bold;margin:6px 0}
select,textarea,input{
 width:100%;padding:10px;
 border-radius:10px;border:1px solid #ccc;
 font-size:15px;margin-bottom:10px
}
button{
 width:100%;padding:12px;
 border:none;border-radius:12px;
 font-size:16px;font-weight:bold;
 cursor:pointer
}
.btn-add{background:#4caf50;color:#fff}
.btn-send{background:#ff9800;color:#fff}
#orderBox,#paymentBox{
 background:#fff;
 margin:15px;padding:15px;
 border-radius:16px;
 box-shadow:0 10px 25px rgba(0,0,0,.1)
}
#orderList li{
 background:#f6f8ff;
 margin-bottom:6px;
 padding:8px;border-radius:8px;
 display:flex;
 justify-content:space-between;
 align-items:center
}
#totalMoney{text-align:center;color:#d32f2f;font-size:18px}
.remove{
 background:#ff5252;color:#fff;
 border:none;width:28px;height:28px;
 border-radius:50%;cursor:pointer
}
</style>
</head>

<body>

<h1>Market Kiều Long</h1>

<div class="products" id="products"></div>

<div id="orderBox">
<h3 style="text-align:center;color:#1e88e5">🧾 ĐƠN HÀNG</h3>
<ul id="orderList"></ul>
<p id="totalMoney"><b>💰 Tổng tiền: 0 đ</b></p>

<h3 style="text-align:center;color:#1e88e5">👤 THÔNG TIN KHÁCH HÀNG</h3>
<input id="customerName" placeholder="Họ và tên">
<input id="customerPhone" placeholder="Số điện thoại">
<textarea id="customerAddress" placeholder="Địa chỉ giao hàng"></textarea>
<textarea id="note" placeholder="Ghi chú thêm (nếu có)"></textarea>

<button class="btn-send" onclick="sendOrder()">📤 GỬI ĐƠN HÀNG</button>
</div>

<div id="paymentBox" style="display:none;text-align:center">
<h3>💳 CHỌN PHƯƠNG THỨC THANH TOÁN</h3>

<button style="background:#4caf50;color:#fff;margin-bottom:10px"
onclick="alert('🚚 Thanh toán khi nhận hàng')">
🚚 Thanh toán khi nhận hàng
</button>

<button style="background:#e53935;color:#fff" onclick="showQR()">
📱 Thanh toán bằng QR
</button>

<div id="qrBox" style="display:none;margin-top:15px">
<p>Quét mã để thanh toán</p>
<img src="qr.jpg" style="width:260px;border-radius:12px">
<p><b>Market Kiều Long</b></p>
</div>
</div>

<script>
const BOT_TOKEN = "8365554346:AAGJdRnQ9sbp2EQIGtP289uwuBwEp3bg-kE";
const CHAT_ID = "6572363141";

const products=[
 {name:"Coca Cola",price:10000,image:"https://i.imgur.com/0Z8FQ0Z.jpg"},
 {name:"Pepsi",price:10000,image:"https://i.imgur.com/qIufhof.jpg"},
 {name:"Nước Suối",price:7000,image:"https://i.imgur.com/9Q5RkXk.jpg"},
 {name:"Mì Gói",price:5000,image:"https://i.imgur.com/zJY6U9F.jpg"},
 {name:"Snack",price:8000,image:"https://i.imgur.com/7n6bJcF.jpg"},
 {name:"Bánh Mì",price:12000,image:"https://i.imgur.com/6kK1XfM.jpg"},
 {name:"Trà Sữa",price:25000,image:"https://i.imgur.com/9b9rKxY.jpg"},
 {name:"Cà Phê",price:20000,image:"https://i.imgur.com/0MZ4X9U.jpg"},
 {name:"Sữa Tươi",price:15000,image:"https://i.imgur.com/5x1JZ9P.jpg"},
 {name:"Nước Cam",price:18000,image:"https://i.imgur.com/D1yGmYz.jpg"}
];

const order={};
const productsDiv=document.getElementById("products");

products.forEach((p,i)=>{
 let opt="";
 for(let k=1;k<=10;k+=0.5) opt+=`<option value="${k}">${k} kg</option>`;
 productsDiv.innerHTML+=`
 <div class="product">
 <img src="${p.image}">
 <h4>${p.name}</h4>
 <div class="price">${p.price.toLocaleString()} đ/kg</div>
 <select id="q${i}">${opt}</select>
 <button class="btn-add" onclick="add(${i})">Chọn</button>
 </div>`;
});

/* ✅ SỬA TẠI ĐÂY: CHỌN NHIỀU LẦN → CỘNG DỒN */
function add(i){
 let q=parseFloat(document.getElementById("q"+i).value);
 let name=products[i].name;
 let price=products[i].price;

 if(order[name]){
   order[name].qty += q;
 }else{
   order[name]={qty:q,price:price};
 }

 renderOrder();
}

function renderOrder(){
 let ul=document.getElementById("orderList");
 let totalBox=document.getElementById("totalMoney");
 ul.innerHTML="";
 let total=0;

 for(let item in order){
  let line=order[item].qty*order[item].price;
  total+=line;
  ul.innerHTML+=`
  <li>
   <span>${item}<br>${order[item].qty} kg × ${order[item].price.toLocaleString()} đ<br><b>${line.toLocaleString()} đ</b></span>
   <button class="remove" onclick="removeItem('${item}')">✕</button>
  </li>`;
 }
 totalBox.innerHTML=`<b>💰 Tổng tiền: ${total.toLocaleString()} đ</b>`;
}

function removeItem(name){
 delete order[name];
 renderOrder();
}

function sendOrder(){
 if(Object.keys(order).length===0){
  alert("❗ Chưa chọn sản phẩm");
  return;
 }
 if(!customerName.value||!customerPhone.value||!customerAddress.value){
  alert("❗ Vui lòng nhập đủ thông tin khách hàng");
  return;
 }

 let msg="🧾 ĐƠN HÀNG MỚI\n\n";
 msg+=`👤 ${customerName.value}\n📞 ${customerPhone.value}\n🏠 ${customerAddress.value}\n\n`;

 let total=0;
 for(let i in order){
  let m=order[i].qty*order[i].price;
  total+=m;
  msg+=`- ${i}: ${order[i].qty} kg = ${m.toLocaleString()}đ\n`;
 }
 msg+=`\n💰 TỔNG: ${total.toLocaleString()}đ\n📝 ${note.value||"Không có"}`;

 fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({chat_id:CHAT_ID,text:msg})
 })
 .then(r=>r.json())
 .then(d=>{
  if(d.ok){
   alert("✅ Đã gửi đơn về điện thoại");
   paymentBox.style.display="block";
   paymentBox.scrollIntoView({behavior:"smooth"});
  }else alert("❌ Telegram lỗi");
 });
}

function showQR(){
 document.getElementById("qrBox").style.display="block";
}
</script>

</body>
</html>
