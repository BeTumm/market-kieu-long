<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Market Kiều Long</title>

<style>
:root{
 --red:#b71c1c;
 --gold:#ffb300;
 --dark:#2b1b17;
}

*{box-sizing:border-box}

body{
 margin:0;
 font-family:'Segoe UI',Arial,sans-serif;
 background:
  linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.65)),
  url("https://images.unsplash.com/photo-1551218808-94e220e084d2");
 background-size:cover;
 background-attachment:fixed;
 color:#fff;
}

/* HEADER */
header{
 background:linear-gradient(135deg,#8e0000,#c62828);
 padding:22px;
 text-align:center;
 font-size:26px;
 font-weight:800;
 letter-spacing:2px;
 box-shadow:0 8px 25px rgba(0,0,0,.6)
}

/* SECTION */
.section{
 background:rgba(255,255,255,.96);
 color:#333;
 margin:20px;
 padding:20px;
 border-radius:26px;
 box-shadow:0 15px 40px rgba(0,0,0,.5)
}

.section h3{
 text-align:center;
 color:#8e0000;
 margin-top:0;
}

/* FORM */
input,textarea,select{
 width:100%;
 padding:14px;
 border-radius:16px;
 border:1px solid #ccc;
 margin-bottom:14px;
 font-size:15px
}

button{
 width:100%;
 padding:16px;
 border:none;
 border-radius:20px;
 font-size:16px;
 font-weight:800;
 cursor:pointer
}

.btn-main{
 background:linear-gradient(135deg,#ffca28,#ff9800);
 color:#4e342e;
 box-shadow:0 6px 18px rgba(0,0,0,.3)
}

.btn-add{
 background:linear-gradient(135deg,#c62828,#8e0000);
 color:#fff;
 box-shadow:0 6px 18px rgba(140,0,0,.6)
}

/* PRODUCTS */
.products{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
 gap:22px
}

.product{
 background:linear-gradient(180deg,#fff,#fbe9e7);
 border-radius:26px;
 overflow:hidden;
 box-shadow:0 12px 30px rgba(0,0,0,.45);
 transition:.25s;
 position:relative
}

.product:hover{
 transform:translateY(-8px)
}

.product img{
 width:100%;
 height:190px;
 object-fit:cover
}

.product::after{
 content:"";
 position:absolute;
 top:0;left:0;right:0;
 height:90px;
 background:linear-gradient(180deg,rgba(0,0,0,.45),transparent)
}

.product h4{
 margin:14px 12px 6px;
 text-align:center;
 font-size:18px;
 color:#4e342e
}

.price{
 text-align:center;
 font-size:18px;
 font-weight:800;
 color:#b71c1c;
 margin-bottom:8px
}

.product select{
 margin:0 14px 10px;
 width:calc(100% - 28px)
}

.product button{
 margin:0 14px 14px;
 width:calc(100% - 28px)
}

/* ORDER */
#orderList li{
 list-style:none;
 background:linear-gradient(135deg,#fff3e0,#ffe0b2);
 margin-bottom:12px;
 padding:14px;
 border-radius:18px;
 display:flex;
 justify-content:space-between;
 align-items:center
}

.remove{
 background:linear-gradient(135deg,#ff5252,#c62828);
 color:#fff;
 border:none;
 width:28px;
 height:28px;
 border-radius:50%;
 font-size:16px;
 font-weight:700;
 cursor:pointer;
 display:flex;
 align-items:center;
 justify-content:center;
 box-shadow:0 4px 12px rgba(0,0,0,.35);
 transition:.2s;
}

.remove:hover{
 transform:scale(1.15);
 background:linear-gradient(135deg,#ff1744,#b71c1c);
}


#totalMoney{
 text-align:center;
 font-size:22px;
 font-weight:900;
 color:#8e0000;
 margin:16px 0
}
</style>
</head>

<body>

<header>🍽️ MARKET KIỀU LONG</header>

<!-- INFO -->
<div class="section" id="infoBox">
<h3>👤 Thông tin khách hàng</h3>
<input id="customerName" placeholder="Họ và tên *">
<input id="customerPhone" placeholder="Số điện thoại *">
<textarea id="customerAddress" placeholder="Địa chỉ giao hàng *"></textarea>
<button class="btn-main" onclick="startShopping()">Bắt đầu chọn món</button>
</div>

<!-- SHOP -->
<div id="shopArea" style="display:none">

<div class="section">
<h3>🛍️ Thực đơn hôm nay</h3>
<div class="products" id="products"></div>
</div>

<div class="section">
<h3>🧾 Đơn hàng</h3>
<ul id="orderList"></ul>
<div id="totalMoney">💰 Tổng tiền: 0 đ</div>
<textarea id="note" placeholder="Ghi chú thêm (nếu có)"></textarea>
<button class="btn-main" onclick="sendOrder()">Gửi đơn hàng</button>
</div>

<div class="section" id="paymentBox" style="display:none;text-align:center">
<h3>💳 Thanh toán</h3>
<button class="btn-add" onclick="alert('Thanh toán khi nhận hàng')">🚚 Thanh toán khi nhận</button>
<button style="background:#e53935;color:#fff" onclick="showQR()">📱 Thanh toán QR</button>
<div id="qrBox" style="display:none;margin-top:14px">
<img src="qr.jpg" style="width:240px;border-radius:14px">
</div>
</div>

</div>

<script>
const BOT_TOKEN="8365554346:AAGJdRnQ9sbp2EQIGtP289uwuBwEp3bg-kE";
const CHAT_ID="6572363141";

const products=[
 {name:"Lòng Mỡ",price:70000,image:"https://cly.1cdn.vn/2022/01/29/s1.media.ngoisao.vn-resize_660-news-2022-01-28-_long-luoc-4-ngoisaovn-w2048-h1536.jpg"},
 {name:"Lòng Tiết",price:70000,image:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTEdc9U2P7U89S6tDGnvM6LvOdOC9Y_mhuT5A&s"},
 {name:"Gan Lợn",price:50000,image:"https://media.cooky.vn/article/s640/Article1302-635894058266480200.jpg"},
 {name:"Phổi Lợn",price:30000,image:"https://bhd.1cdn.vn/2021/09/10/files-library-images-site-1-20210910-web-bo-phan-o-lon-tuyet-doi-phai-bo-keo-ca-nha-ung-thu-30-161959.jpg"},
 {name:"Chí Đá",price:450000,image:"https://cdn2.fptshop.com.vn/unsafe/800x0/bi_quyet_luoc_trang_lon_03_82bd2e013b.jpg"},
 {name:"Tiết Luộc",price:15000,image:"https://phongkhambinhan.com/wp-content/uploads/2024/10/tiet-lon.jpg"},
 {name:"Cuống Họng",price:200000,image:"https://cdn2.fptshop.com.vn/unsafe/1920x0/filters:format(webp):quality(75)/cuong_hong_heo_0_c8e4ca6df7.jpg"},
 {name:"Bong Bóng Lợn",price:20000,image:"https://cdn.tgdd.vn/2021/01/content/bb9-800x500.jpg"},
 {name:"Lòng Non",price:70000,image:"https://cdn.tgdd.vn/Files/2024/06/02/1566412/meo-so-che-long-non-cuc-hieu-qua-ma-khong-dung-giam-va-muoi-202406030115021361.jpg"},
 {name:"Đầu Lòng Non",price:200000,image:"https://cdn.tgdd.vn/Files/2022/02/11/1414960/long-se-dieu-la-gi-gia-long-se-dieu-cach-luoc-long-se-dieu-dung-chuan-202202111353265979.jpg"},
 {name:"Nõn Đuôi",price:150000,image:"https://img-global.cpcdn.com/recipes/591f2d32d911a1b5/680x781cq80/kh%E1%BA%A5u-duoi-heo-pha-l%E1%BA%A5u-recipe-main-photo.jpg"},
 {name:"Dạ Dày",price:370000,image:"https://cdn.tgdd.vn/Files/2019/12/27/1228778/2-cach-luoc-bao-tu-heo-gion-ngon-ban-nen-biet--760x367.jpg"},
 {name:"Cổ Hũ",price:400000,image:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRMJJOAGhMac3lZd-JmlEVfx8j_8xFsPueJJw&s"}
];

const order={},productsDiv=document.getElementById("products");

function startShopping(){
 if(!customerName.value||!customerPhone.value||!customerAddress.value){
  alert("Vui lòng nhập đầy đủ thông tin");
  return;
 }
 infoBox.style.display="none";
 shopArea.style.display="block";
}

products.forEach((p,i)=>{
 let opt="";
 for(let k=1;k<=10;k+=0.5) opt+=`<option>${k} kg</option>`;
 productsDiv.innerHTML+=`
 <div class="product">
  <img src="${p.image}">
  <h4>${p.name}</h4>
  <div class="price">${p.price.toLocaleString()} đ/kg</div>
  <select id="q${i}">${opt}</select>
  <button class="btn-add" onclick="add(${i})">➕ Thêm món</button>
 </div>`;
});

function add(i){
 let q=parseFloat(document.getElementById("q"+i).value);
 let n=products[i].name,p=products[i].price;
 order[n]?order[n].qty+=q:order[n]={qty:q,price:p};
 render();
}

function render(){
 orderList.innerHTML="";
 let total=0;
 for(let i in order){
  let m=order[i].qty*order[i].price;
  total+=m;
  orderList.innerHTML+=`
  <li>
   <span>${i}<br>${order[i].qty} kg</span>
   <b>${m.toLocaleString()} đ</b>
   <button class="remove" onclick="delete order['${i}'],render()">×</button>
  </li>`;
 }
 totalMoney.innerHTML=`💰 Tổng tiền: ${total.toLocaleString()} đ`;
}

function sendOrder(){
  if(Object.keys(order).length === 0){
    alert("❌ Chưa có sản phẩm nào trong đơn");
    return;
  }

  let msg = `🛒 ĐƠN HÀNG MỚI\n\n` +
            `👤 Tên: ${customerName.value}\n` +
            `📞 SĐT: ${customerPhone.value}\n` +
            `📍 Địa chỉ: ${customerAddress.value}\n\n` +
            `📦 CHI TIẾT ĐƠN:\n`;

  let total = 0;
  for(let i in order){
    let money = order[i].qty * order[i].price;
    total += money;
    msg += `- ${i}: ${order[i].qty} kg = ${money.toLocaleString()} đ\n`;
  }

  msg += `\n💰 TỔNG TIỀN: ${total.toLocaleString()} đ\n`;
msg += `📝 Ghi chú: ${note.value || "Không có"}`;


  fetch("https://api.telegram.org/bot8365554346:AAGJdRnQ9sbp2EQIGtP289uwuBwEp3bg-kE/sendMessage",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      chat_id: "6572363141",
      text: msg
    })
  })
  .then(res => res.json())
  .then(data => {
    if(data.ok){
      alert("✅ Đã gửi đơn hàng thành công");
      paymentBox.style.display="block";
    }else{
      alert("❌ Telegram lỗi: " + data.description);
      console.error(data);
    }
  })
  .catch(err=>{
    alert("❌ Không kết nối được Telegram");
    console.error(err);
  });
}
function showQR(){qrBox.style.display="block";}
</script>

</body>
</html>
