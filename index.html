<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Market Kiều Lòng</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{--red:#b71c1c;--gold:#ffb300}
*{box-sizing:border-box}

body{
 margin:0;
 font-family:'Poppins',sans-serif;
 background:linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.65)),
 url("https://images.unsplash.com/photo-1551218808-94e220e084d2");
 background-size:cover;
 background-attachment:fixed;
 color:#fff
}

header{
 background:linear-gradient(135deg,#8e0000,#c62828);
 padding:22px;
 text-align:center;
 font-size:26px;
 font-weight:700;
}

.section{
 background:#fff;
 color:#333;
 margin:20px;
 padding:20px;
 border-radius:26px;
 box-shadow:0 15px 40px rgba(0,0,0,.5)
}

input,textarea,select{
 width:100%;
 padding:14px;
 border-radius:16px;
 border:1px solid #ddd;
 margin-bottom:14px;
 font-family:'Poppins',sans-serif;
}

button{
 width:100%;
 padding:14px;
 border:none;
 border-radius:20px;
 font-weight:600;
 cursor:pointer;
 font-family:'Poppins',sans-serif;
 transition: 0.3s;
}

.btn-main{
 background:linear-gradient(135deg,#ffca28,#ff9800);
 color: #333;
}

.btn-add{
 background:linear-gradient(135deg,#c62828,#8e0000);
 color:#fff;
}

/* PRODUCTS */
.products{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
 gap:22px
}

.product{
 background:#fff;
 border-radius:26px;
 overflow:hidden;
 box-shadow:0 12px 30px rgba(0,0,0,.45)
}

.product img{
 width:100%;
 height:190px;
 object-fit:cover
}

.price{
 text-align:center;
 font-weight:700;
 color:#b71c1c;
 margin-bottom:8px;
}

/* CART ICON */
#cartIcon{
 position:fixed;
 bottom:22px;
 right:22px;
 width:60px;
 height:60px;
 border-radius:50%;
 background:linear-gradient(135deg,#ff9800,#f44336);
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:26px;
 font-weight:700;
 cursor:pointer;
 z-index:9999;
 box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

#cartCount{
 position:absolute;
 top:-6px;
 right:-6px;
 background:#000;
 width:22px;
 height:22px;
 border-radius:50%;
 font-size:13px;
 display:flex;
 align-items:center;
 justify-content:center;
 color: #fff;
}
/* HOTLINE ICON */
#hotlineIcon {
  position: fixed;
  bottom: 95px; /* Cách đáy màn hình 95px để nằm trên nút giỏ hàng */
  right: 22px;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: linear-gradient(135deg, #2ecc71, #27ae60);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  z-index: 9999;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  text-decoration: none;
  /* Hiệu ứng rung nhẹ thu hút sự chú ý */
  animation: shake 2s infinite;
}

@keyframes shake {
  0% { transform: rotate(0deg); }
  10% { transform: rotate(-10deg); }
  20% { transform: rotate(10deg); }
  30% { transform: rotate(-10deg); }
  40% { transform: rotate(10deg); }
  50% { transform: rotate(0deg); }
  100% { transform: rotate(0deg); }
}

#hotlineIcon:hover {
  background: #27ae60;
  transform: scale(1.1);
}
/* MODAL */
.modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.65);
 display:none;
 align-items:center;
 justify-content:center;
 z-index:9999;
}

.modal-box{
 background:#fff;
 color:#333;
 width:95%;
 max-width:420px;
 border-radius:26px;
 padding:22px;
 max-height: 90vh;
 overflow-y: auto;
}

/* ORDER LIST */
#orderList { padding: 0; }
#orderList li {
    list-style: none;
    background: #fffaf0;
    margin-bottom: 12px;
    padding: 15px 18px;
    border-radius: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid #ffe0b2;
}

/* NÚT ĐIỀU CHỈNH SỐ LƯỢNG (+/-) */
.qty-btn {
    width: 28px;
    height: 28px;
    padding: 0;
    border-radius: 8px;
    background: #eee;
    color: #333;
    font-size: 18px;
    line-height: 28px;
}
.qty-btn:hover { background: #ddd; }

/* NÚT XOÁ */
.remove-all {
    background: transparent;
    color: #bbb;
    font-size: 14px;
    width: auto;
    padding: 5px;
}
.remove-all:hover { color: #c62828; }

#qrBox {
    text-align: center;
    background: #f9f9f9;
    padding: 20px;
    border-radius: 20px;
    margin: 15px 0;
}
#qrBox img {
    display: block;
    margin: 0 auto 10px auto;
    border: 5px solid #fff;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}
</style>
</head>

<body>


<header>🍽️ MARKET KIỀU LÒNG</header>

<div class="section" id="infoBox">
<h3 style="text-align:center">👤 Thông tin giao hàng</h3>
<input id="customerName" placeholder="Họ tên">
<input id="customerPhone" placeholder="Số điện thoại">
<textarea id="customerAddress" placeholder="Địa chỉ giao hàng"></textarea>
<button class="btn-main" onclick="startShopping()">Bắt đầu chọn món</button>
</div>

<div id="shopArea" style="display:none">
<div class="section">
<h3 style="text-align:center">🛍️ Thực đơn</h3>
<div class="products" id="products"></div>
</div>
</div>
<a href="tel:0977487543" id="hotlineIcon">
  <span class="phone-icon">📞</span>
</a>

<div id="cartIcon" onclick="openCart()">🛒<span id="cartCount">0</span></div>

<div class="modal" id="cartModal">
<div class="modal-box">
<h3 style="text-align:center; color:#c62828">🧾 Giỏ hàng</h3>
<ul id="orderList"></ul>
<div id="totalMoney" style="text-align:center; font-weight:bold; font-size:18px; margin: 15px 0;">💰 Tổng: 0 đ</div>
<textarea id="note" placeholder="Ghi chú thêm..."></textarea>
<button class="btn-main" onclick="sendOrder()" style="margin-bottom:10px">📤 Gửi đơn hàng</button>
<button onclick="closeCart()" style="background:#eee">Tiếp tục chọn</button>
</div>
</div>

<div class="modal" id="paymentModal">
<div class="modal-box">
<h3 style="text-align:center">💳 Thanh toán</h3>
<button class="btn-add" onclick="payCOD()" style="margin-bottom:15px">🚚 Thanh toán khi nhận hàng</button>
<button style="background:#e53935; color:#fff" onclick="payQR()">📱 Thanh toán qua mã QR</button>
<div id="qrBox" style="display:none;">
<img src="qr.jpg" style="width:240px; border-radius:14px">
<p><strong>Cửa hàng Kiều Lòng</strong></p>
</div>
<button onclick="closePayment()" style="background:#eee; margin-top:10px">Hoàn tất</button>
</div>
</div>

<script>
const BOT_TOKEN="8365554346:AAGJdRnQ9sbp2EQIGtP289uwuBwEp3bg-kE";
const CHAT_ID="6572363141";

let lastOrderMessage="";
const order={};

const products=[
 {
  name: "Lòng Nhồi", 
  price: 50000, 
  image: "https://dienmayhoki.com/wp-content/uploads/2023/10/cach-lam-doi-heo-1.jpg",
  subTypes: ["Lòng Mỡ", "Lòng Tiết"] // Thêm dòng này
 },
 {name:"Gan Lợn",price:50000,image:"https://media.cooky.vn/article/s640/Article1302-635894058266480200.jpg"},
 {name:"Phổi Lợn",price:30000,image:"https://bhd.1cdn.vn/2021/09/10/files-library-images-site-1-20210910-web-bo-phan-o-lon-tuyet-doi-phai-bo-keo-ca-nha-ung-thu-30-161959.jpg"},
 {name:"Chí Đá",price:450000,image:"https://cdn2.fptshop.com.vn/unsafe/800x0/bi_quyet_luoc_trang_lon_03_82bd2e013b.jpg"},
 {name:"Tiết Luộc",price:15000,image:"https://phongkhambinhan.com/wp-content/uploads/2024/10/tiet-lon.jpg"},
 {name:"Cuống Họng",price:200000,image:"https://cdn2.fptshop.com.vn/unsafe/1920x0/filters:format(webp):quality(75)/cuong_hong_heo_0_c8e4ca6df7.jpg"},
 {name:"Bong Bóng Lợn",price:20000,image:"https://cdn.tgdd.vn/2021/01/content/bb9-800x500.jpg"},
 {name:"Lòng Non",price:70000,image:"https://cdn.tgdd.vn/Files/2024/06/02/1566412/meo-so-che-long-non-cuc-hieu-qua-ma-khong-dung-giam-va-muoi-202406030115021361.jpg"},
 {name:"Đầu Lòng Non",price:200000,image:"https://cdn.tgdd.vn/Files/2022/02/11/1414960/long-se-dieu-la-gi-gia-long-se-dieu-cach-luoc-long-se-dieu-dung-chuan-202202111353265979.jpg"},
 {name:"Nõn Đuôi",price:150000,image:"https://img-global.cpcdn.com/recipes/591f2d32d911a1b5/680x781cq80/kh%E1%BA%A5u-duoi-heo-pha-l%E1%BA%A5u-recipe-main-photo.jpg"},
 {name:"Dạ Dày",price:370000,image:"https://cdn.tgdd.vn/Files/2019/12/27/1228778/2-cach-luoc-bao-tu-heo-gion-ngon-ban-nen-biet--760x367.jpg"},
 {name:"Cổ Hũ",price:400000,image:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRMJJOAGhMac3lZd-JmlEVfx8j_8xFsPueJJw&s"},
 {name:"Lá Lách Lợn",price:30000,image:"https://cdn.24h.com.vn/upload/2-2021/images/2021-05-07/Phan-nay-cua-con-lon-rat-bo-duong-cho-la-lach-va-da-day-lam-mon-nhau-cung-rat-tuyet-1-1620380256-518-width640height426.jpeg"},
 {name:"Đuôi Lợn",price:150000,image:"https://danviet.ex-cdn.com/files/f1/296231569849192448/2022/6/29/duoi-lon-16564625234451740961109.jpg"},
];

const productsDiv=document.getElementById("products");

function startShopping(){
 if(!customerName.value || !customerPhone.value || !customerAddress.value) { alert("Vui lòng nhập đủ thông tin!"); return; }
 infoBox.style.display="none"; shopArea.style.display="block";
}

products.forEach((p, i) => {
    let weightOptions = "";
    for (let k = 0.5; k <= 5; k += 0.5) {
        weightOptions += `<option value="${k}" ${k === 1 ? "selected" : ""}>${k} kg</option>`;
    }

    // Kiểm tra nếu sản phẩm có loại phụ (như Lòng Nhồi)
    let typeSelect = "";
    if (p.subTypes) {
        typeSelect = `<select id="t${i}" style="margin-bottom: 5px;">`;
        p.subTypes.forEach(type => {
            typeSelect += `<option value="${type}">${type}</option>`;
        });
        typeSelect += `</select>`;
    }

    productsDiv.innerHTML += `
    <div class="product">
        <img src="${p.image}">
        <h4 style="text-align:center">${p.name}</h4>
        <div class="price">${p.price.toLocaleString()} đ/kg</div>
        <div style="padding:0 15px">
            ${typeSelect} <select id="q${i}">${weightOptions}</select>
            <button class="btn-add" onclick="add(${i})" style="margin-bottom:15px">➕ Thêm món</button>
        </div>
    </div>`;
});

function add(i){
 let q=parseFloat(document.getElementById("q"+i).value);
 let n=products[i].name, p=products[i].price;
 order[n]?order[n].qty+=q:order[n]={qty:q,price:p};
 render(); updateCart();
}

// HÀM TĂNG/GIẢM TRỰC TIẾP TRONG GIỎ HÀNG
function changeQty(name, amount){
    order[name].qty += amount;
    if(order[name].qty <= 0) delete order[name];
    render(); updateCart();
}

function render(){
 orderList.innerHTML=""; let total=0;
 for(let i in order){
  let m=order[i].qty*order[i].price; total+=m;
  orderList.innerHTML+=`
  <li>
    <div><strong>${i}</strong><br><small>${order[i].price.toLocaleString()}đ/kg</small></div>
    <div style="display:flex; align-items:center; gap:10px">
        <button class="qty-btn" onclick="changeQty('${i}', -0.5)">-</button>
        <b style="min-width:45px; text-align:center">${order[i].qty}kg</b>
        <button class="qty-btn" onclick="changeQty('${i}', 0.5)">+</button>
        <b style="color:#b71c1c; min-width:80px; text-align:right">${m.toLocaleString()}đ</b>
    </div>
  </li>`;
 }
 totalMoney.innerHTML=`💰 Tổng cộng: ${total.toLocaleString()} đ`;
}

function updateCart(){
 let c=0; for(let i in order) c++; cartCount.innerText=c;
}

function openCart(){render(); cartModal.style.display="flex"}
function closeCart(){cartModal.style.display="none"}

function sendOrder(){
 if(Object.keys(order).length === 0){ alert("Giỏ hàng trống!"); return; }
 let msg=`🛒 ĐƠN HÀNG MỚI\n👤 Khách: ${customerName.value}\n📞 SĐT: ${customerPhone.value}\n📍 ĐC: ${customerAddress.value}\n\n`;
 let total=0;
 for(let i in order){
  let m=order[i].qty*order[i].price; total+=m;
  msg+=`- ${i}: ${order[i].qty}kg = ${m.toLocaleString()}đ\n`;
 }
 msg+=`\n💰 Tổng: ${total.toLocaleString()}đ\n📝 Ghi chú: ${note.value||"Không có"}`;
 lastOrderMessage=msg;

 fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{
  method:"POST",headers:{'Content-Type':'application/json'},
  body:JSON.stringify({chat_id:CHAT_ID,text:msg})
 }).then(()=>{ closeCart(); paymentModal.style.display="flex"; });
}

function payCOD(){sendPay("🚚 Thanh toán khi nhận"); alert("Đơn hàng đã được xác nhận!"); closePayment()}
function payQR(){sendPay("📱 Chọn Thanh toán QR"); qrBox.style.display="block"}
function sendPay(m){ fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{ method:"POST",headers:{'Content-Type':'application/json'}, body:JSON.stringify({chat_id:CHAT_ID,text:lastOrderMessage+"\n\n💳 "+m}) }); }
function closePayment(){paymentModal.style.display="none"; qrBox.style.display="none";}
function getDevice() {
  return /mobile|android|iphone/i.test(navigator.userAgent)
    ? "Thiết bị di động"
    : "Máy tính";
}

window.addEventListener("load", () => {
  fetch("https://script.google.com/macros/s/AKfycbzYsyD_pPBUrSb_B5_2u4y9iSkr_nIThVYU06ntp3vP0qad7Tg5SiBZT6apwfVi_mi2/exec", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      source: "Bấm đường link",
      device: getDevice()
    })
  });
});
</script>

</body>
</html>
